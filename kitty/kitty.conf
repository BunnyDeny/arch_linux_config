shell fish

# 字体大小：1.33 缩放下默认 11pt 偏大易换行，调到 10（不满意改这个数）
font_size 12

# 西文字体，用 Nerd Font 版本，顺便提供 💡、bufferline 那些图标
# （不写 font_family 的话 kitty 用默认的 monospace，图标只能靠系统 fallback 碰运气）
font_family JetBrainsMono Nerd Font Mono

# 中文单独指定字体。不写这行的话中文会 fallback 到文泉驿等宽正黑
# （2005 年前后的老字体，小字号下笔画糊在一起、字形也过时），思源黑体好看得多
# 区间依次是：中文标点、汉字、兼容汉字、全角符号
symbol_map U+3000-U+303F,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Source Han Sans CN


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

#window
window_padding_width 15
background_blur 30
